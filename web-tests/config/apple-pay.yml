# Apple Pay — requires a real iOS device
# Run by swapping browserstack.yml: cp config/apple-pay.yml browserstack.yml

userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

projectName: BrowserStack Demo
buildName: Apple Pay Demo
buildIdentifier: "#${BUILD_NUMBER}"

platforms:
  - deviceName: iPhone 16
    osVersion: "18.0"
    browserName: safari

parallelsPerPlatform: 1
browserstackLocal: ${BROWSERSTACK_LOCAL}

# Apple Pay root-level capabilities (per BrowserStack docs)
enableApplePay: true
applePayPreferredNetworks: ["Visa", "Mastercard"]
appium:nativeWebTap: true
# Apple Pay setup takes longer than the default idle timeout (max 300 for Automate)
idleTimeout: 300
