# Apple Pay — requires a real iOS device
# Run by swapping browserstack.yml: cp config/apple-pay.yml browserstack.yml

userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

projectName: demo-pipeline
buildName: jest-bstack-apple-pay
buildIdentifier: "#${BUILD_NUMBER}"

platforms:
  - deviceName: iPhone 17 Pro
    osVersion: "26.0"
    browserName: safari

parallelsPerPlatform: 1
browserstackLocal: false

# Apple Pay root-level capabilities (per BrowserStack docs)
enableApplePay: true
appium:nativeWebTap: true
# Apple Pay setup takes longer than the default idle timeout (max 300 for Automate)
idleTimeout: 300
