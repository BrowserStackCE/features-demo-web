# GPS & IP Geolocation — uses BrowserStack geoLocation capability
# Run: npx browserstack-node-sdk jest --config-file config/geolocation.yml --testPathPattern="tests/(gps|ip-geolocation)"

userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

projectName: demo-pipeline
buildName: jest-bstack-geolocation
buildIdentifier: "#${BUILD_NUMBER}"

platforms:
  - browser: chrome
    browser_version: latest
    os: Windows
    os_version: 10
    capabilities:
      geoLocation: US

parallelsPerPlatform: 1
browserstackLocal: false
idleTimeout: 300
