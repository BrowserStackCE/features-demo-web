# Browser Permissions — BrowserStack config
# No permission prefs — all permissions start at "prompt".
# Each test grants its own permission via a JS mock on button click (no CDP).
# Run: BROWSERSTACK_CONFIG_FILE='config/permissions.yml' browserstack-node-sdk jest --testPathPattern=tests/permissions

userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

projectName: BrowserStack Demo
buildName: Browser-Permission Demo
buildIdentifier: "#${BUILD_NUMBER}"

platforms:
  - browserName: chrome
    browser_version: latest
    os: Windows
    os_version: 10
    goog:chromeOptions:
      args:
        - "--use-fake-device-for-media-stream"

parallelsPerPlatform: 1
browserstackLocal: false
idleTimeout: 300
