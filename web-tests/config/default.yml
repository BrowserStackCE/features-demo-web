# Default BrowserStack config — used for most feature tests
# Run: npx browserstack-node-sdk jest --config-file config/default.yml

userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

projectName: demo-pipeline
buildName: jest-bstack-build
buildIdentifier: "#${BUILD_NUMBER}"

platforms:
  - browser: chrome
    browser_version: latest
    os: Windows
    os_version: 10
  - browser: firefox
    browser_version: latest
    os: OS X
    os_version: Monterey

parallelsPerPlatform: 1
browserstackLocal: false
idleTimeout: 300
