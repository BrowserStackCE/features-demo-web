# Self-Healing Selectors — enables BrowserStack AI Self-Heal Agent
# Run: npx browserstack-node-sdk --config-file config/self-healing.yml jest --testPathPattern="tests/self-healing"
# Docs: https://www.browserstack.com/docs/automate/selenium/self-healing

userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

projectName: BrowserStack Demo
buildName: AI Self-Healing Demo
buildIdentifier: "#${BUILD_NUMBER}"

platforms:
  - browser: chrome
    browser_version: latest
    os: Windows
    os_version: 10
  - browserName: chrome
    osVersion: 15.0
    deviceName: Samsung Galaxy *
  - browserName: safari
    osVersion: 16
    deviceName: iPhone *

parallelsPerPlatform: 1
browserstackLocal: ${BROWSERSTACK_LOCAL}
idleTimeout: 300
selfHeal: true
