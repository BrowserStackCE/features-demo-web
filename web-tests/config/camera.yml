# Camera Injection — uses BrowserStack cameraInjection capability
# Run: npx browserstack-node-sdk jest --config-file config/camera.yml --testPathPattern="tests/camera"

userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

projectName: demo-pipeline
buildName: jest-bstack-camera
buildIdentifier: "#${BUILD_NUMBER}"

platforms:
  - browser: chrome
    browser_version: latest
    os: Windows
    os_version: 10
    capabilities:
      cameraInjection: true

parallelsPerPlatform: 1
browserstackLocal: false
idleTimeout: 300
