# IP Geolocation — BrowserStack config
# Run: BROWSERSTACK_CONFIG_FILE='config/ip-geolocation.yml' browserstack-node-sdk jest --testPathPattern=tests/ip-geolocation

userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

projectName: BrowserStack Demo
buildName: Geolocation-Demo
buildIdentifier: "#${BUILD_NUMBER}"

platforms:
  - browser: chrome
    browser_version: latest
    os: Windows
    os_version: 10
  - browser: firefox
    browser_version: latest
    os: OS X
    os_version: Monterey

parallelsPerPlatform: 1
browserstackLocal: false
idleTimeout: 300
geoLocation: US