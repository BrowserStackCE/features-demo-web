# Locale & Timezone — uses BrowserStack timezone and browserLanguage capabilities
# Run: npx browserstack-node-sdk jest --config-file config/locale.yml --testPathPattern="tests/locale"

userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

projectName: demo-pipeline
buildName: jest-bstack-locale
buildIdentifier: "#${BUILD_NUMBER}"

platforms:
  - browser: chrome
    browser_version: latest
    os: Windows
    os_version: 10
    capabilities:
      timezone: New_York
      browserLanguage: fr-FR

parallelsPerPlatform: 1
browserstackLocal: false
idleTimeout: 300
