# Network Speed — uses BrowserStack networkProfile capability for throttling
# Run: npm run test:network
# Docs: https://www.browserstack.com/docs/automate/selenium/simulate-network-conditions
# networkProfile is supported on Android/iOS real devices only (not desktop).

userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

projectName: BrowserStack Demo
buildName: Network Simulation Demo
buildIdentifier: "#${BUILD_NUMBER}"

platforms:
  - browser: chrome
    browser_version: latest
    os: Windows
    os_version: 10
  - browserName: chrome
    osVersion: 15.0
    deviceName: Samsung Galaxy *
  - browserName: safari
    osVersion: 16
    deviceName: iPhone *


# 4g-lte-advanced-good: 25000 kbps down / 18000 kbps up / 80 ms latency
networkProfile: 4g-lte-advanced-good

parallelsPerPlatform: 1
browserstackLocal: ${BROWSERSTACK_LOCAL}
idleTimeout: 300
