# Network Speed — uses BrowserStack networkProfile capability for throttling
# Run: npx browserstack-node-sdk jest --config-file config/network.yml --testPathPattern="tests/network-speed"

userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

projectName: demo-pipeline
buildName: jest-bstack-network
buildIdentifier: "#${BUILD_NUMBER}"

platforms:
  - browser: chrome
    browser_version: latest
    os: Windows
    os_version: 10
    capabilities:
      networkProfile: 4g-lte-advanced-good

parallelsPerPlatform: 1
browserstackLocal: false
idleTimeout: 300
