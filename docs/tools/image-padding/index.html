<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/ort.wasm.min.js" integrity="sha384-IIbXcAhgJQi54B2BSFW89jOHuticITcB+QZcTVdOax8V9g6V4t9a3y6VoS0Psk+A" crossorigin="anonymous"></script>
<script>
// PadFit core: viewfinder from one screenshot, subject from the image, padded output.
// Port of scripts/single.py, scripts/subject.py and scripts/padfit.py. Images are RGBA cv.Mat.
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory;
  else root.PadFitCore = factory;
})(typeof self !== 'undefined' ? self : this, function (cv, ort, modelBytes, provider = 'wasm') {
  const keep = [];
  const M = (m) => (keep.push(m), m);
  const free = () => { while (keep.length) { const m = keep.pop(); if (m && !m.isDeleted()) m.delete(); } };

  function box(r) { return cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(2 * r + 1, 2 * r + 1)); }
  function dilate(src, r) {
    const k = box(r), d = new cv.Mat();
    cv.dilate(src, d, k, new cv.Point(-1, -1), 1, cv.BORDER_CONSTANT, new cv.Scalar(0));
    k.delete(); return d;
  }
  function erode(src, r) {
    const k = box(r), d = new cv.Mat();
    cv.erode(src, d, k, new cv.Point(-1, -1), 1, cv.BORDER_CONSTANT, new cv.Scalar(255));
    k.delete(); return d;
  }
  function not(src) { const d = new cv.Mat(); cv.bitwise_not(src, d); return d; }
  function meanIn(mask, region) { return cv.countNonZero(region) ? cv.mean(mask, region)[0] / 255 : 0; }

  function shapeKind(fill) {
    return fill > 0.97 ? 'rectangle' : fill > 0.86 ? 'rounded-rectangle' : fill > 0.74 ? 'oval' : 'free-shape';
  }

  // ---------- viewfinder from one screenshot ----------
  function marks(gray) {
    const med = M(new cv.Mat()), diff = M(new cv.Mat()), m = new cv.Mat();
    cv.medianBlur(gray, med, 31);
    cv.absdiff(gray, med, diff);
    cv.threshold(diff, m, 35, 255, cv.THRESH_BINARY);
    return m;
  }

  function ringSupport(region, m, r) {
    const outer = M(dilate(region, r)), inner = M(erode(region, r)), ring = M(new cv.Mat());
    cv.subtract(outer, inner, ring);
    if (!cv.countNonZero(ring)) return 0;
    const md = M(dilate(m, 2));
    return meanIn(md, ring);
  }

  function components(mask, conn) {
    const lab = new cv.Mat(), st = new cv.Mat(), ce = new cv.Mat();
    const n = cv.connectedComponentsWithStats(mask, lab, st, ce, conn, cv.CV_32S);
    const out = [];
    for (let i = 1; i < n; i++) {
      out.push({ id: i, x: st.intAt(i, 0), y: st.intAt(i, 1), w: st.intAt(i, 2), h: st.intAt(i, 3), n: st.intAt(i, 4) });
    }
    st.delete(); ce.delete();
    return { lab, comps: out };
  }

  function brackets3(ui, w) {
    const { lab, comps } = components(ui, 4);
    const L = lab.data32S, W = lab.cols;
    const cand = [];
    for (const c of comps) {
      const bw = c.w, bh = c.h;
      if (Math.min(bw, bh) < 0.04 * w || Math.max(bw, bh) > 0.3 * w || !(bw / bh > 0.5 && bw / bh < 2) || c.n / (bw * bh) > 0.45) continue;
      const q = [0, 0, 0, 0], hx = Math.floor(bw / 2), hy = Math.floor(bh / 2);
      for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
        if (L[(c.y + y) * W + c.x + x] === c.id) q[(y < hy ? 0 : 2) + (x < hx ? 0 : 1)]++;
      }
      const k = q.indexOf(Math.max(...q));
      const x0 = c.x, y0 = c.y, x1 = c.x + bw - 1, y1 = c.y + bh - 1;
      cand.push([k, k === 0 ? [x0, y0] : k === 1 ? [x1, y0] : k === 2 ? [x0, y1] : [x1, y1]]);
    }
    lab.delete();
    const tol = 0.03 * w;
    let best = null;
    for (let i = 0; i < cand.length; i++) for (let j = i + 1; j < cand.length; j++) {
      const two = [cand[i], cand[j]];
      const pick = (ks, f, axis) => { const v = two.filter(([k]) => ks.includes(k)).map(([, p]) => p[axis]); return v.length ? f(...v) : null; };
      const Lx = pick([0, 2], Math.min, 0), Rx = pick([1, 3], Math.max, 0), Ty = pick([0, 1], Math.min, 1), By = pick([2, 3], Math.max, 1);
      if ([Lx, Rx, Ty, By].includes(null) || Rx - Lx < 0.2 * w || By - Ty < 0.1 * w) continue;
      const want = { 0: [Lx, Ty], 1: [Rx, Ty], 2: [Lx, By], 3: [Rx, By] };
      const hit = new Set(cand.filter(([k, p]) => Math.abs(p[0] - want[k][0]) < tol && Math.abs(p[1] - want[k][1]) < tol).map(([k]) => k));
      if (hit.size >= 3) {
        const area = (Rx - Lx) * (By - Ty);
        if (!best || hit.size > best.hits || (hit.size === best.hits && area > best.area)) best = { r: [Lx, Ty, Rx, By], hits: hit.size, area };
      }
    }
    return best;
  }

  // returns {result, mask} where mask is a full-resolution 8U viewfinder mask (convex)
  function viewfinder(rgba) {
    const step = 2;
    const full = M(new cv.Mat());
    cv.cvtColor(rgba, full, cv.COLOR_RGBA2GRAY);
    const gray = M(new cv.Mat());
    cv.resize(full, gray, new cv.Size(Math.ceil(full.cols / step), Math.ceil(full.rows / step)), 0, 0, cv.INTER_NEAREST);
    const h = gray.rows, w = gray.cols;
    const m = M(marks(gray));
    const r = Math.max(2, Math.floor(w / 40));
    const free_ = M(not(M(dilate(m, r))));
    const { lab, comps } = components(free_, 4);
    M(lab);
    const cands = [];
    for (const c of comps) {
      if (c.x <= 2 || c.y <= 2 || c.x + c.w >= w - 2 || c.y + c.h >= h - 2) continue;
      if (Math.min(c.w, c.h) <= 0.12 * w || c.n < 0.01 * w * h) continue;
      const hole = M(new cv.Mat());
      const lo = M(new cv.Mat(h, w, cv.CV_32S, new cv.Scalar(c.id))), hi = lo;
      cv.inRange(lab, lo, hi, hole);
      const cs = M(new cv.MatVector()), hier = M(new cv.Mat());
      cv.findContours(hole, cs, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_NONE);
      const filled = M(cv.Mat.zeros(h, w, cv.CV_8U));
      cv.drawContours(filled, cs, -1, new cv.Scalar(255), -1);
      const reg = dilate(filled, r);
      const cx = (c.x + c.w / 2) / w - 0.5, cy = (c.y + c.h / 2) / h - 0.5;
      const sup = ringSupport(reg, m, 3);
      cands.push({ score: cv.countNonZero(reg) * (1 - 0.8 * Math.hypot(cx, cy)) * sup ** 3, reg, sup });
    }
    let mode, win, conf = 0;
    if (cands.length) {
      cands.sort((a, b) => b.score - a.score);
      win = cands[0].reg; conf = cands[0].sup; mode = 'enclosed-guide';
      cands.slice(1).forEach((c) => c.reg.delete());
    } else {
      const ui = M(m.clone());
      ui.roi(new cv.Rect(0, 0, w, Math.floor(0.06 * h))).setTo(new cv.Scalar(0));
      const bb = brackets3(ui, w);
      win = cv.Mat.zeros(h, w, cv.CV_8U);
      if (bb) {
        const [x0, y0, x1, y1] = bb.r;
        cv.rectangle(win, new cv.Point(x0, y0), new cv.Point(x1, y1), new cv.Scalar(255), -1);
        mode = 'corner-brackets'; conf = bb.hits === 4 ? 0.8 : 0.6;
      } else {
        win.setTo(new cv.Scalar(255)); mode = 'no-guide-found';
      }
    }
    M(win);
    const br = cv.boundingRect(win);
    const fill = cv.countNonZero(win) / (br.width * br.height);
    const result = { mode, shape: shapeKind(fill), confidence: Math.round(conf * 100) / 100,
      window_px: [br.x * step, br.y * step, br.width * step, br.height * step] };
    const up = new cv.Mat();
    cv.resize(win, up, new cv.Size(full.cols, full.rows), 0, 0, cv.INTER_NEAREST);
    const cs = M(new cv.MatVector()), hier = M(new cv.Mat());
    cv.findContours(up, cs, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
    const all = M(new cv.Mat());
    const pts = [];
    for (let i = 0; i < cs.size(); i++) { const d = cs.get(i).data32S; for (let k = 0; k < d.length; k++) pts.push(d[k]); }
    const ptsMat = M(cv.matFromArray(pts.length / 2, 1, cv.CV_32SC2, pts));
    cv.convexHull(ptsMat, all, false, true);
    up.setTo(new cv.Scalar(0));
    const hv = M(new cv.MatVector()); hv.push_back(all);
    cv.drawContours(up, hv, 0, new cv.Scalar(255), -1);
    const hull = Array.from(all.data32S);
    free();
    return { result, mask: up, hull };
  }

  // ---------- subject in the image to inject ----------
  let session = null;
  async function foregroundMask(rgba) {
    if (!session) session = await ort.InferenceSession.create(modelBytes, { executionProviders: [provider] });
    const s = M(new cv.Mat());
    cv.resize(rgba, s, new cv.Size(320, 320), 0, 0, cv.INTER_LINEAR);
    const d = s.data, x = new Float32Array(3 * 320 * 320);
    const mean = [0.485, 0.456, 0.406], std = [0.229, 0.224, 0.225];
    for (let i = 0; i < 320 * 320; i++) for (let c = 0; c < 3; c++) x[c * 320 * 320 + i] = (d[i * 4 + c] / 255 - mean[c]) / std[c];
    const feeds = {}; feeds[session.inputNames[0]] = new ort.Tensor('float32', x, [1, 3, 320, 320]);
    const out = (await session.run(feeds))[session.outputNames[0]].data;
    let lo = Infinity, hi = -Infinity;
    for (const v of out) { if (v < lo) lo = v; if (v > hi) hi = v; }
    const small = M(cv.matFromArray(320, 320, cv.CV_32F, Array.from(out, (v) => (v - lo) / Math.max(1e-6, hi - lo))));
    const big = M(new cv.Mat()), mask = new cv.Mat();
    cv.resize(small, big, new cv.Size(rgba.cols, rgba.rows), 0, 0, cv.INTER_LINEAR);
    cv.threshold(big, big, 0.5, 255, cv.THRESH_BINARY);
    big.convertTo(mask, cv.CV_8U);
    free();
    return mask;
  }

  // spectral residual saliency (cv.saliency is not in OpenCV.js)
  function saliencyMask(rgba) {
    const g = M(new cv.Mat()), s = M(new cv.Mat());
    cv.cvtColor(rgba, g, cv.COLOR_RGBA2GRAY);
    cv.resize(g, s, new cv.Size(64, 64), 0, 0, cv.INTER_AREA);
    const f = M(new cv.Mat()); s.convertTo(f, cv.CV_32F);
    const planes = M(new cv.MatVector()); planes.push_back(f); planes.push_back(M(cv.Mat.zeros(64, 64, cv.CV_32F)));
    const cx = M(new cv.Mat()); cv.merge(planes, cx); cv.dft(cx, cx);
    const sp = M(new cv.MatVector()); cv.split(cx, sp);
    const re = sp.get(0), im = sp.get(1);
    const mag = M(new cv.Mat()), ph = M(new cv.Mat()); cv.cartToPolar(re, im, mag, ph);
    re.delete(); im.delete();
    const one = M(new cv.Mat(64, 64, cv.CV_32F, new cv.Scalar(1)));

      if (b && b.kind !== 'whole') {
        x.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--guide').trim(); x.lineWidth = lw(ci);
        if (b.pts) { x.beginPath(); b.pts.forEach(([px, py], i) => (i ? x.lineTo(px * ci.width, py * ci.height) : x.moveTo(px * ci.width, py * ci.height))); x.closePath(); x.stroke(); }
        else if (b.corners) { x.beginPath(); b.corners.forEach(([px, py], i) => (i ? x.lineTo(px, py) : x.moveTo(px, py))); x.closePath(); x.stroke(); }
        else x.strokeRect(b.x * ci.width, b.y * ci.height, b.w * ci.width, b.h * ci.height);
      }
      if (drawPath && drawPath.length > 1) { x.setLineDash([lw(ci) * 3, lw(ci) * 2]); x.strokeStyle = '#ffb000'; x.lineWidth = lw(ci); x.beginPath(); drawPath.forEach(([px, py], i) => (i ? x.lineTo(px, py) : x.moveTo(px, py))); x.stroke(); x.setLineDash([]); }
      if (drawBox) { x.setLineDash([lw(ci) * 3, lw(ci) * 2]); x.strokeStyle = '#ffb000'; x.lineWidth = lw(ci); if (S.mode === 'oval') { x.beginPath(); x.ellipse(drawBox.x + drawBox.w / 2, drawBox.y + drawBox.h / 2, drawBox.w / 2, drawBox.h / 2, 0, 0, 2 * Math.PI); x.stroke(); } else x.strokeRect(drawBox.x, drawBox.y, drawBox.w, drawBox.h); x.setLineDash([]); }
    }
    if (S.shot && S.crop && S.vf) {
      renderOutput(co);
      cc.width = S.shot.width; cc.height = S.shot.height; const x = cc.getContext('2d');
      x.drawImage(S.shot, 0, 0); drawSubject(x, 0.85); outline(x, lw(cc));
      $('save').disabled = false;
    }
    status();
  }
  function status() {
    const el = $('status'); el.textContent = '';
    const pill = (t, cls) => { const s = document.createElement('span'); s.className = 'pill ' + (cls || ''); s.textContent = t; el.appendChild(s); };
    if (S.vf) {
      const r = S.vf.result, ok = r.confidence >= 0.6;
      pill(`viewfinder: ${r.mode} · ${r.shape} · confidence ${r.confidence.toFixed(2)}`, ok ? 'ok' : 'warn');
      if (!ok) pill('Low confidence: check the green line, or use the two-gradient method', 'warn');
    }
    if (S.subj) {
      const s = S.subj.sure;
      pill(`subject: ${S.subj.chosen ? nice(S.subj.chosen.kind) : 'none'} · confidence ${(s.confidence || 0).toFixed(2)}`, s.verdict === 'sure' ? 'ok' : 'warn');
    }
    if (S.vf && S.crop) {
      const inside = insideViewfinder();
      pill(inside ? 'subject inside the viewfinder' : 'subject goes outside the viewfinder', inside ? 'ok' : 'warn');
      pill(`output ${S.shot.width} × ${S.shot.height}`);
    }
  }

  // ---------- controls ----------
  function syncControls() {
    $('angleVal').textContent = `${(((angle() % 360) + 360) % 360).toFixed(1).replace(/\.0$/, '')}°`;
    $('fine').value = S.fine; $('size').value = Math.round(S.size * 100);
    $('sizeVal').textContent = `${Math.round(S.size * 100)}% of largest fit`;
  }
  const refit = () => { autoFit(); syncControls(); renderAll(); };
  $('rotL').addEventListener('click', () => { S.rot90 = (S.rot90 + 3) % 4; refit(); });
  $('rotR').addEventListener('click', () => { S.rot90 = (S.rot90 + 1) % 4; refit(); });
  $('fine').addEventListener('input', (e) => { S.fine = +e.target.value; refit(); });
  $('size').addEventListener('input', (e) => { S.size = +e.target.value / 100; syncControls(); renderAll(); });
  $('fit').addEventListener('click', () => { S.size = 0.92; refit(); });
  $('reset').addEventListener('click', () => {
    if (!S.subj) return;
    S.cands = S.cands.filter((c) => c.b.kind !== 'manual' && c.b.kind !== 'lasso');
    S.sel = S.subj.chosen && S.subj.sure.verdict === 'sure' ? 0 : S.cands.length - 1;
    S.rot90 = 0; S.fine = 0; S.size = 0.92; buildChips(); makeCrop(); refit();
  });

  const toCanvasXY = (c, e) => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };

  // move + resize on the check view
  let drag = null;
  const cc = $('cCheck');
  cc.addEventListener('pointerdown', (e) => { if (!S.crop) return; const [x, y] = toCanvasXY(cc, e); drag = { x, y, cx: S.cx, cy: S.cy }; cc.setPointerCapture(e.pointerId); cc.classList.add('dragging'); });
  cc.addEventListener('pointermove', (e) => { if (!drag) return; const [x, y] = toCanvasXY(cc, e); S.cx = drag.cx + x - drag.x; S.cy = drag.cy + y - drag.y; requestAnimationFrame(renderAll); });
  const endDrag = () => { drag = null; cc.classList.remove('dragging'); };
  cc.addEventListener('pointerup', endDrag); cc.addEventListener('pointercancel', endDrag);
  cc.addEventListener('wheel', (e) => { if (!S.crop) return; e.preventDefault(); S.size = Math.min(1.5, Math.max(0.1, S.size * (e.deltaY < 0 ? 1.04 : 1 / 1.04))); syncControls(); renderAll(); }, { passive: false });

  // move or resize the drawn subject on the image view
  const ci = $('cImg');
  const selPts = (b) => b.pts || [[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h]];
  const editable = () => { const b = S.cands[S.sel] && S.cands[S.sel].b; return b && (b.kind === 'manual' || b.kind === 'lasso') ? b : null; };
  function hit(b, nx, ny) {
    const p = selPts(b); let inside = false;
    for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
      const [xi, yi] = p[i], [xj, yj] = p[j];
      if ((yi > ny) !== (yj > ny) && nx < (xj - xi) * (ny - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  function setSel(b) {
    const c = S.cands[S.sel];
    c.b = b.pts ? { kind: 'lasso', pts: b.pts } : { kind: 'manual', x: b.x, y: b.y, w: b.w, h: b.h };
  }
  function shifted(b, dx, dy) {
    const p = selPts(b), xs = p.map((q) => q[0]), ys = p.map((q) => q[1]);
    dx = Math.min(1 - Math.max(...xs), Math.max(-Math.min(...xs), dx)); dy = Math.min(1 - Math.max(...ys), Math.max(-Math.min(...ys), dy));
    return b.pts ? { pts: b.pts.map(([x, y]) => [x + dx, y + dy]) } : { x: b.x + dx, y: b.y + dy, w: b.w, h: b.h };
  }
  function scaled(b, k) {
    const p = selPts(b), xs = p.map((q) => q[0]), ys = p.map((q) => q[1]);
    const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
    const f = ([x, y]) => [Math.min(1, Math.max(0, cx + (x - cx) * k)), Math.min(1, Math.max(0, cy + (y - cy) * k))];
    if (b.pts) return { pts: b.pts.map(f) };
    const [x0, y0] = f([b.x, b.y]), [x1, y1] = f([b.x + b.w, b.y + b.h]); return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }
  let moveSel = null, selTimer = null;
  const nxy = (e) => { const [x, y] = toCanvasXY(ci, e); return [x / ci.width, y / ci.height]; };
  const commitSel = () => { makeCrop(); refit(); };
  ci.addEventListener('pointerdown', (e) => {
    const b = editable(); if (!b) return; const [nx, ny] = nxy(e);
    if (!hit(b, nx, ny)) return;
    e.stopImmediatePropagation(); moveSel = { start: [nx, ny], orig: JSON.parse(JSON.stringify(b)) }; ci.setPointerCapture(e.pointerId);
  });
  ci.addEventListener('pointermove', (e) => {
    const [nx, ny] = nxy(e);
    if (!moveSel) { const b = editable(); ci.style.cursor = b && hit(b, nx, ny) ? 'move' : 'crosshair'; return; }
    e.stopImmediatePropagation();
    setSel(shifted(moveSel.orig, nx - moveSel.start[0], ny - moveSel.start[1])); requestAnimationFrame(renderAll);
  });
  ci.addEventListener('pointerup', (e) => { if (!moveSel) return; e.stopImmediatePropagation(); moveSel = null; commitSel(); });
  ci.addEventListener('wheel', (e) => {
    const b = editable(); if (!b || !hit(b, ...nxy(e))) return;
    e.preventDefault(); setSel(scaled(b, e.deltaY < 0 ? 1.04 : 1 / 1.04)); renderAll();
    clearTimeout(selTimer); selTimer = setTimeout(commitSel, 150);
  }, { passive: false });

  // draw a subject box or free shape on the image view
  let drawBox = null, drawStart = null, drawPath = null;
  const setMode = (m) => { S.mode = m; $('modeBox').setAttribute('aria-pressed', String(m === 'box')); $('modeOval').setAttribute('aria-pressed', String(m === 'oval')); $('modeFree').setAttribute('aria-pressed', String(m === 'free')); };
  $('modeOval').addEventListener('click', () => setMode('oval'));
  $('modeBox').addEventListener('click', () => setMode('box'));
  $('modeFree').addEventListener('click', () => setMode('free'));
  ci.addEventListener('pointerdown', (e) => {
    if (!S.img || S.mode !== 'free') return;
    drawPath = [toCanvasXY(ci, e)]; ci.setPointerCapture(e.pointerId);
  });
  ci.addEventListener('pointermove', (e) => {
    if (!drawPath) return; const p = toCanvasXY(ci, e), q = drawPath[drawPath.length - 1];
    if (Math.hypot(p[0] - q[0], p[1] - q[1]) < ci.width / 300) return;
    drawPath.push(p); requestAnimationFrame(renderAll);
  });
  ci.addEventListener('pointerup', () => {
    if (!drawPath) return; const path = drawPath; drawPath = null;
    const W = S.img.width, H = S.img.height;
    const pts = path.map(([x, y]) => [Math.min(W, Math.max(0, x)) / W, Math.min(H, Math.max(0, y)) / H]);
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    if (pts.length < 6 || (Math.max(...xs) - Math.min(...xs)) * W < 12 || (Math.max(...ys) - Math.min(...ys)) * H < 12) { renderAll(); return; }
    S.cands = S.cands.filter((c) => c.b.kind !== 'manual' && c.b.kind !== 'lasso');
    S.cands.push({ b: { kind: 'lasso', pts }, label: 'Your shape' }); S.sel = S.cands.length - 1;
    buildChips(); makeCrop(); refit();
  });
  ci.addEventListener('pointerdown', (e) => { if (!S.img || S.mode === 'free') return; drawStart = toCanvasXY(ci, e); drawBox = { x: drawStart[0], y: drawStart[1], w: 0, h: 0 }; ci.setPointerCapture(e.pointerId); });
  ci.addEventListener('pointermove', (e) => {
    if (!drawStart) return; const [x, y] = toCanvasXY(ci, e);
    drawBox = { x: Math.min(x, drawStart[0]), y: Math.min(y, drawStart[1]), w: Math.abs(x - drawStart[0]), h: Math.abs(y - drawStart[1]) };
    requestAnimationFrame(renderAll);
  });
  ci.addEventListener('pointerup', () => {
    if (!drawStart) return; const b = drawBox; drawStart = null; drawBox = null;
    if (!b || b.w < 12 || b.h < 12) { renderAll(); return; }
    const W = S.img.width, H = S.img.height;
    const x = Math.max(0, b.x), y = Math.max(0, b.y);
    if (S.mode === 'oval') {
      const pts = []; for (let i = 0; i < 64; i++) { const t = i / 64 * 2 * Math.PI; pts.push([Math.min(W, Math.max(0, b.x + b.w / 2 + b.w / 2 * Math.cos(t))) / W, Math.min(H, Math.max(0, b.y + b.h / 2 + b.h / 2 * Math.sin(t))) / H]); }
      S.cands = S.cands.filter((c) => c.b.kind !== 'manual' && c.b.kind !== 'lasso');
      S.cands.push({ b: { kind: 'lasso', pts }, label: 'Your oval' }); S.sel = S.cands.length - 1;
      buildChips(); makeCrop(); refit(); return;
    }
    const man = { kind: 'manual', x: x / W, y: y / H, w: Math.min(W - x, b.w) / W, h: Math.min(H - y, b.h) / H };
    S.cands = S.cands.filter((c) => c.b.kind !== 'manual' && c.b.kind !== 'lasso');
    S.cands.push({ b: man, label: 'Your box' }); S.sel = S.cands.length - 1;
    buildChips(); makeCrop(); refit();
  });

  // save
  $('save').addEventListener('click', async () => {
    const c = document.createElement('canvas'); renderOutput(c);
    const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
    const base = (S.img && $('nameImg').textContent.replace(/^Example: /, '').replace(/\.[a-z0-9]+$/i, '').replace(/[^\w-]+/g, '_')) || 'image';
    if (!blob) { setMsg('Save failed: could not create the PNG.'); return; }
    const filename = `padfit_${base}_${c.width}x${c.height}.png`;
    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename; a.style.display = 'none';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      setMsg('Saved ' + filename);
    } catch (e) { setMsg('Save failed: ' + (e && e.message || e)); }
  });

  syncControls();
  boot();
})();
</script>

</body></html>
