<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Browser Permissions — BrowserStack Automate</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{brand:{50:'#f5f3ff',600:'#7c3aed',700:'#6d28d9'}}}}}</script><link rel="stylesheet" href="style.css"/></head><body class="bg-gray-50 font-sans antialiased"><nav class="bg-white border-b border-gray-200 sticky top-0 z-50"><div class="max-w-3xl mx-auto px-6 h-16 flex items-center gap-3"><a href="index.html" class="text-gray-500 hover:text-gray-700 text-sm flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>All demos</a><span class="text-gray-300">|</span><span class="font-semibold text-gray-900 text-sm">Browser Permissions</span></div></nav>
<div class="max-w-3xl mx-auto px-6 py-10 space-y-6">
<div class="flex items-center gap-4"><div class="w-12 h-12 bg-green-600 rounded-xl flex items-center justify-center shrink-0"><svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg></div><div><h1 class="text-2xl font-bold text-gray-900">Browser Permissions</h1><p class="text-gray-500 text-sm">Request and display camera, microphone, and location permission states</p></div></div>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
  <div class="bg-white rounded-2xl border border-gray-200 p-5 flex flex-col items-center gap-3 text-center"><div class="w-12 h-12 bg-violet-100 rounded-xl flex items-center justify-center"><svg class="w-6 h-6 text-violet-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg></div><p class="font-semibold text-gray-900">Camera</p><span id="camera-perm-status" class="text-xs bg-gray-100 text-gray-500 px-2.5 py-1 rounded-full">unknown</span><button id="req-camera-perm" class="w-full bg-violet-600 hover:bg-violet-700 text-white text-sm font-semibold py-2 rounded-xl">Request</button></div>
  <div class="bg-white rounded-2xl border border-gray-200 p-5 flex flex-col items-center gap-3 text-center"><div class="w-12 h-12 bg-pink-100 rounded-xl flex items-center justify-center"><svg class="w-6 h-6 text-pink-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg></div><p class="font-semibold text-gray-900">Microphone</p><span id="mic-perm-status" class="text-xs bg-gray-100 text-gray-500 px-2.5 py-1 rounded-full">unknown</span><button id="req-mic-perm" class="w-full bg-pink-600 hover:bg-pink-700 text-white text-sm font-semibold py-2 rounded-xl">Request</button></div>
  <div class="bg-white rounded-2xl border border-gray-200 p-5 flex flex-col items-center gap-3 text-center"><div class="w-12 h-12 bg-teal-100 rounded-xl flex items-center justify-center"><svg class="w-6 h-6 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg></div><p class="font-semibold text-gray-900">Location</p><span id="location-perm-status" class="text-xs bg-gray-100 text-gray-500 px-2.5 py-1 rounded-full">unknown</span><button id="req-location-perm" class="w-full bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold py-2 rounded-xl">Request</button></div>
</div>
</div><script>

function setBadge(id,state){const el=document.getElementById(id);const m={granted:'bg-green-100 text-green-700',denied:'bg-red-100 text-red-700',prompt:'bg-yellow-100 text-yellow-700'};el.textContent=state;el.className='text-xs px-2.5 py-1 rounded-full '+(m[state]||'bg-gray-100 text-gray-500');}
async function qp(name,bid){try{const r=await navigator.permissions.query({name});setBadge(bid,r.state);r.onchange=()=>setBadge(bid,r.state);}catch(e){}}
qp('camera','camera-perm-status');qp('microphone','mic-perm-status');qp('geolocation','location-perm-status');
document.getElementById('req-camera-perm').addEventListener('click',async()=>{try{const s=await navigator.mediaDevices.getUserMedia({video:true});s.getTracks().forEach(t=>t.stop());setBadge('camera-perm-status','granted');}catch(e){setBadge('camera-perm-status','denied');}});
document.getElementById('req-mic-perm').addEventListener('click',async()=>{try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());setBadge('mic-perm-status','granted');}catch(e){setBadge('mic-perm-status','denied');}});
document.getElementById('req-location-perm').addEventListener('click',()=>{navigator.geolocation.getCurrentPosition(()=>setBadge('location-perm-status','granted'),()=>setBadge('location-perm-status','denied'));});

</script></body></html>
