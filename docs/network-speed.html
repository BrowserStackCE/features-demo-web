<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Network Speed Test — BrowserStack Automate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css"/>
</head>
<body class="bg-gray-50 font-sans antialiased">
<nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-3xl mx-auto px-6 h-16 flex items-center gap-3">
    <a href="index.html" class="text-gray-500 hover:text-gray-700 text-sm">&#8592; All demos</a>
    <span class="text-gray-300">|</span>
    <span class="font-semibold text-gray-900 text-sm">Network Speed Test</span>
  </div>
</nav>
<div class="max-w-3xl mx-auto px-6 py-10 space-y-6">
  <h1 class="text-2xl font-bold text-gray-900">Network Speed Test</h1>
  <p class="text-gray-500 text-sm">Measure download speed and latency — validates BrowserStack network throttling profiles</p>
  <div class="bg-white rounded-2xl border border-gray-200 p-6 space-y-5">
    <div class="grid grid-cols-3 gap-4 text-center">
      <div class="bg-yellow-50 rounded-xl p-4"><p class="text-xs text-yellow-600 mb-1">Download Speed</p><p id="speed-result" class="text-3xl font-bold text-yellow-900">--</p><p class="text-xs text-yellow-600 mt-1">Mbps</p></div>
      <div class="bg-gray-50 rounded-xl p-4"><p class="text-xs text-gray-500 mb-1">Latency</p><p id="speed-latency" class="text-3xl font-bold text-gray-900">--</p><p class="text-xs text-gray-500 mt-1">ms</p></div>
      <div class="bg-gray-50 rounded-xl p-4"><p class="text-xs text-gray-500 mb-1">Connection Type</p><p id="effective-type" class="text-3xl font-bold text-gray-900">--</p><p class="text-xs text-gray-500 mt-1">Network Info API</p></div>
    </div>
    <div class="w-full bg-gray-100 rounded-full h-2"><div id="speed-progress-bar" class="bg-yellow-500 h-2 rounded-full transition-all" style="width:0%"></div></div>
    <button id="run-speed-test" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-semibold py-2.5 rounded-xl">Run Speed Test</button>
    <p id="speed-status" class="text-center text-sm text-gray-500 hidden"></p>
  </div>
  </div>
<script>
const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
if (conn) document.getElementById("effective-type").textContent = conn.effectiveType || "--";
document.getElementById("run-speed-test").addEventListener("click", async () => {
  const btn = document.getElementById("run-speed-test"), status = document.getElementById("speed-status"), bar = document.getElementById("speed-progress-bar");
  btn.disabled = true; btn.textContent = "Testing...";
  status.textContent = "Measuring latency..."; status.classList.remove("hidden"); bar.style.width = "10%";
  const t0 = performance.now();
  try { await fetch("https://www.cloudflare.com/cdn-cgi/trace", {method:"HEAD",cache:"no-store"}); } catch(e) {}
  document.getElementById("speed-latency").textContent = Math.round(performance.now() - t0);
  bar.style.width = "30%"; status.textContent = "Measuring download speed...";
  try {
    const url = "https://speed.cloudflare.com/__down?bytes=1000000&_=" + Date.now();
    const start = performance.now();
    const resp = await fetch(url, {cache:"no-store"});
    const buf = await resp.arrayBuffer();
    const elapsed = (performance.now() - start) / 1000;
    document.getElementById("speed-result").textContent = ((buf.byteLength * 8) / elapsed / 1e6).toFixed(2);
    bar.style.width = "100%"; status.textContent = "Test complete";
  } catch(e) { status.textContent = "Error: " + e.message; }
  if (conn) document.getElementById("effective-type").textContent = conn.effectiveType || "--";
  btn.disabled = false; btn.textContent = "Run Speed Test";
});
</script>
</body>
</html>
