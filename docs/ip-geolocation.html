<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>IP Geolocation — BrowserStack Automate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css"/>
</head>
<body class="bg-gray-50 font-sans antialiased">
<nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-3xl mx-auto px-6 h-16 flex items-center gap-3">
    <a href="index.html" class="text-gray-500 hover:text-gray-700 text-sm">&#8592; All demos</a>
    <span class="text-gray-300">|</span>
    <span class="font-semibold text-gray-900 text-sm">IP Geolocation</span>
  </div>
</nav>
<div class="max-w-3xl mx-auto px-6 py-10 space-y-6">
  <h1 class="text-2xl font-bold text-gray-900">IP Geolocation</h1>
  <p class="text-gray-500 text-sm">Fetch IP-derived location via ipapi.co — validates BrowserStack geoLocation capability</p>
  <div class="bg-white rounded-2xl border border-gray-200 p-6 space-y-4">
    <button id="fetch-ip-geo" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-semibold py-2.5 rounded-xl">Fetch My Location</button>
    <div id="geo-loading" class="hidden text-center text-sm text-gray-500 py-2">Fetching...</div>
    <div id="geo-error" class="hidden bg-red-50 border border-red-200 rounded-xl p-4 text-sm text-red-700"></div>
    <div id="geo-results" class="hidden grid grid-cols-2 gap-3">
      <div class="bg-gray-50 rounded-xl p-4"><p class="text-xs text-gray-400 mb-1">IP Address</p><p id="ip-address" class="font-mono font-semibold text-sm"></p></div>
      <div class="bg-gray-50 rounded-xl p-4"><p class="text-xs text-gray-400 mb-1">Country</p><p id="ip-country" class="font-semibold text-sm"></p></div>
      <div class="bg-gray-50 rounded-xl p-4"><p class="text-xs text-gray-400 mb-1">City</p><p id="ip-city" class="font-semibold text-sm"></p></div>
      <div class="bg-gray-50 rounded-xl p-4"><p class="text-xs text-gray-400 mb-1">ISP</p><p id="ip-isp" class="font-semibold text-sm truncate"></p></div>
      <div class="bg-gray-50 rounded-xl p-4"><p class="text-xs text-gray-400 mb-1">Region</p><p id="ip-region" class="font-semibold text-sm"></p></div>
      <div class="bg-gray-50 rounded-xl p-4"><p class="text-xs text-gray-400 mb-1">Timezone</p><p id="ip-timezone" class="font-semibold text-sm"></p></div>
    </div>
  </div>
  </div>
<script>
document.getElementById("fetch-ip-geo").addEventListener("click", async () => {
  const L=document.getElementById("geo-loading"), E=document.getElementById("geo-error"), R=document.getElementById("geo-results");
  L.classList.remove("hidden"); E.classList.add("hidden"); R.classList.add("hidden");
  try {
    const r = await fetch("https://ipapi.co/json/");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    document.getElementById("ip-address").textContent = d.ip || "--";
    document.getElementById("ip-country").textContent = (d.country_name || "--") + (d.country_code ? " (" + d.country_code + ")" : "");
    document.getElementById("ip-city").textContent = d.city || "--";
    document.getElementById("ip-isp").textContent = d.org || "--";
    document.getElementById("ip-region").textContent = d.region || "--";
    document.getElementById("ip-timezone").textContent = d.timezone || "--";
    R.classList.remove("hidden");
  } catch(e) { E.textContent = "Error: " + e.message; E.classList.remove("hidden"); }
  finally { L.classList.add("hidden"); }
});
</script>
</body>
</html>
