<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>GPS Location — BrowserStack Automate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css"/>
</head>
<body class="bg-gray-50 font-sans antialiased">
<nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-3xl mx-auto px-6 h-16 flex items-center gap-3">
    <a href="index.html" class="text-gray-500 hover:text-gray-700 text-sm">&#8592; All demos</a>
    <span class="text-gray-300">|</span>
    <span class="font-semibold text-gray-900 text-sm">GPS Location</span>
  </div>
</nav>
<div class="max-w-3xl mx-auto px-6 py-10 space-y-6">
  <h1 class="text-2xl font-bold text-gray-900">GPS Location</h1>
  <p class="text-gray-500 text-sm">Get precise GPS coordinates via the browser Geolocation API</p>
  <div class="bg-white rounded-2xl border border-gray-200 p-6 space-y-4">
    <button id="get-gps-btn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2.5 rounded-xl">Get My GPS Location</button>
    <div id="gps-error" class="hidden bg-red-50 border border-red-200 rounded-xl p-4 text-sm text-red-700"></div>
    <div id="gps-results" class="hidden space-y-3">
      <div class="grid grid-cols-3 gap-3">
        <div class="bg-teal-50 rounded-xl p-4 text-center"><p class="text-xs text-teal-500 mb-1">Latitude</p><p id="gps-lat" class="font-mono font-bold text-teal-900"></p></div>
        <div class="bg-teal-50 rounded-xl p-4 text-center"><p class="text-xs text-teal-500 mb-1">Longitude</p><p id="gps-lng" class="font-mono font-bold text-teal-900"></p></div>
        <div class="bg-teal-50 rounded-xl p-4 text-center"><p class="text-xs text-teal-500 mb-1">Accuracy</p><p id="gps-accuracy" class="font-mono font-bold text-teal-900"></p></div>
      </div>
      <a id="map-link" href="#" target="_blank" class="block w-full text-center bg-teal-600 text-white font-semibold py-2.5 rounded-xl text-sm">View on OpenStreetMap</a>
    </div>
  </div>
  </div>
<script>
document.getElementById("get-gps-btn").addEventListener("click", () => {
  document.getElementById("gps-error").classList.add("hidden");
  document.getElementById("gps-results").classList.add("hidden");
  if (!navigator.geolocation) {
    document.getElementById("gps-error").textContent = "Geolocation not supported";
    document.getElementById("gps-error").classList.remove("hidden"); return;
  }
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude.toFixed(6), lng = pos.coords.longitude.toFixed(6), acc = Math.round(pos.coords.accuracy) + "m";
    document.getElementById("gps-lat").textContent = lat;
    document.getElementById("gps-lng").textContent = lng;
    document.getElementById("gps-accuracy").textContent = acc;
    document.getElementById("map-link").href = "https://www.openstreetmap.org/?mlat=" + lat + "&mlon=" + lng + "&zoom=14";
    document.getElementById("gps-results").classList.remove("hidden");
  }, err => {
    document.getElementById("gps-error").textContent = "Error: " + err.message;
    document.getElementById("gps-error").classList.remove("hidden");
  }, {enableHighAccuracy: true, timeout: 10000});
});
</script>
</body>
</html>
